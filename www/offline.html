<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YasamGit</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .box{max-width:320px}
  .icon{font-size:56px;margin-bottom:12px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#8b949e;font-size:14px;margin:0 0 20px;line-height:1.5}
  button{background:#238636;color:#fff;border:0;border-radius:8px;padding:12px 24px;font-size:15px}
</style></head>
<body><div class="box">
  <div class="icon">📡</div>
  <h1>Tidak ada koneksi internet</h1>
  <p>YasamGit hanya bisa dibuka saat online. Periksa koneksi kamu lalu coba lagi.</p>
  <button id="retry">Coba Lagi</button>
</div>
<script>
  var TARGET = "https://terminal.yasamdev.web.id/";
  function go(){ if (navigator.onLine) location.href = TARGET; }
  document.getElementById("retry").onclick = function(){
    if (navigator.onLine) go(); else this.textContent = "Masih offline...";
    var b=this; setTimeout(function(){ b.textContent="Coba Lagi"; },1500);
  };
  window.addEventListener("online", go);
</script></body></html>
