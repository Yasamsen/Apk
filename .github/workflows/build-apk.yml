name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "HTTPS URL to load in WebView"
        required: true
        type: string
      app_name:
        description: "Android app display name"
        required: true
        type: string
      package_name:
        description: "Android package ID"
        required: true
        type: string
      icon_url:
        description: "Optional HTTPS URL of PNG/JPG launcher icon"
        required: false
        type: string
      icon_data:
        description: "Optional compressed JPEG data URL (preferred when uploaded)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate inputs
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          ICON_URL: ${{ inputs.icon_url }}
          ICON_DATA: ${{ inputs.icon_data }}
        run: |
          python - <<'PY'
          import os, re
          from urllib.parse import urlparse
          u = urlparse(os.environ["WEBSITE_URL"])
          if u.scheme != "https" or not u.hostname or u.username or u.password:
              raise SystemExit("URL must be HTTPS and contain no credentials")
          name = os.environ["APP_NAME"]
          if not name or len(name) > 40 or any(ord(c) < 32 or c in "<>" for c in name):
              raise SystemExit("Invalid app name")
          if not re.fullmatch(r"[a-z][a-z0-9]*(\.[a-z][a-z0-9]*){1,6}", os.environ["PACKAGE_NAME"]):
              raise SystemExit("Invalid package name")
          if os.environ.get("ICON_URL"):
              icon = urlparse(os.environ["ICON_URL"])
              if icon.scheme != "https" or not icon.hostname or icon.username or icon.password:
                  raise SystemExit("Icon URL must be HTTPS without credentials")
          if len(os.environ.get("ICON_DATA", "")) > 45000:
              raise SystemExit("Icon data is too large")
          PY

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Avoid setup-android action defaulting to the obsolete "tools" package.
      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found on runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create minimal Android project
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi
          python - <<'PY'
          import os, pathlib, re
          pkg = os.environ["PACKAGE_NAME"]
          path = pathlib.Path("app/src/main/java") / pathlib.Path(pkg.replace(".", "/"))
          path.mkdir(parents=True, exist_ok=True)
          (path / "MainActivity.java").write_text(r'''package __PACKAGE__;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.view.ViewGroup;
          import android.view.KeyEvent;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.PermissionRequest;
          import android.webkit.GeolocationPermissions;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient.FileChooserParams;
          import android.content.Intent;
          import android.net.Uri;
          import android.app.DownloadManager;
          import android.webkit.CookieManager;
          import android.webkit.URLUtil;
          import android.os.Environment;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.webkit.JavascriptInterface;
          import android.util.Base64;
          import android.content.ContentValues;
          import android.provider.MediaStore;
          import java.io.OutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;

          public class MainActivity extends Activity {
              private WebView webView;
              private PermissionRequest pendingWebPermission;
              private GeolocationPermissions.Callback pendingGeoCallback;
              private String pendingGeoOrigin;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_CODE = 7003;
              private static final int WEB_PERMISSION_CODE = 7001;
              private static final int GEO_PERMISSION_CODE = 7002;
              private String startUrl = "__URL__";
              private final class BlobDownloadBridge {
                  @JavascriptInterface public void saveBlob(String dataUrl, String requestedName, String requestedMime) {
                      new Thread(() -> {
                          try {
                              String[] parts = dataUrl.split(",", 2);
                              if (parts.length != 2) throw new IOException("Data file tidak valid");
                              byte[] bytes = Base64.decode(parts[1], Base64.DEFAULT);
                              String name = requestedName == null ? "download" : requestedName.replaceAll("[\\/:*?\"<>|]", "_").trim();
                              if (name.isEmpty()) name = "download";
                              final String finalName = name;
                              String mime = requestedMime == null || requestedMime.isEmpty() ? "application/octet-stream" : requestedMime;
                              Uri savedUri = null;
                              if (Build.VERSION.SDK_INT >= 29) {
                                  ContentValues values = new ContentValues();
                                  values.put(MediaStore.Downloads.DISPLAY_NAME, name);
                                  values.put(MediaStore.Downloads.MIME_TYPE, mime);
                                  values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                                  values.put(MediaStore.Downloads.IS_PENDING, 1);
                                  savedUri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                                  if (savedUri == null) throw new IOException("Tidak bisa membuat file di folder Download");
                                  try (OutputStream out = getContentResolver().openOutputStream(savedUri)) {
                                      if (out == null) throw new IOException("Tidak bisa menulis file");
                                      out.write(bytes);
                                  }
                                  ContentValues done = new ContentValues(); done.put(MediaStore.Downloads.IS_PENDING, 0);
                                  getContentResolver().update(savedUri, done, null, null);
                              } else {
                                  File dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                                  if (dir == null) throw new IOException("Folder download tidak tersedia");
                                  if (!dir.exists()) dir.mkdirs();
                                  File file = new File(dir, name);
                                  try (FileOutputStream out = new FileOutputStream(file)) { out.write(bytes); }
                              }
                              runOnUiThread(() -> android.widget.Toast.makeText(MainActivity.this, "Download selesai: " + finalName, android.widget.Toast.LENGTH_LONG).show());
                          } catch (Exception e) {
                              android.util.Log.e("Web2APK", "Blob download gagal", e);
                              String reason = e.getMessage() == null ? "gagal menyimpan file" : e.getMessage();
                              runOnUiThread(() -> android.widget.Toast.makeText(MainActivity.this, "Download gagal: " + reason, android.widget.Toast.LENGTH_LONG).show());
                          }
                      }).start();
                  }
              }
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Gunakan WebView langsung tanpa SwipeRefreshLayout agar swipe vertikal
                  // untuk scroll tidak dianggap sebagai perintah reload halaman.
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setGeolocationEnabled(true);
                  webView.addJavascriptInterface(new BlobDownloadBridge(), "AndroidBlobDownload");
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                      }
                      @Override public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if ("app".equals(request.getUrl().getScheme()) && "retry".equals(request.getUrl().getHost())) {
                              view.loadUrl(startUrl);
                              return true;
                          }
                          return false;
                      }
                      @Override public void onReceivedError(WebView view, WebResourceRequest request, android.webkit.WebResourceError error) {
                          super.onReceivedError(view, request, error);
                          if (request.isForMainFrame()) showOfflinePage();
                      }
                      @Override public void onReceivedHttpError(WebView view, WebResourceRequest request, android.webkit.WebResourceResponse response) {
                          super.onReceivedHttpError(view, request, response);
                          if (request.isForMainFrame() && response.getStatusCode() >= 500) showOfflinePage();
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          try {
                              Intent intent = params != null ? params.createIntent() : new Intent(Intent.ACTION_GET_CONTENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              if (intent.getType() == null || intent.getType().equals("*/*")) intent.setType("*/*");
                              startActivityForResult(Intent.createChooser(intent, "Pilih file atau foto"), FILE_CHOOSER_CODE);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                      @Override public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (Build.VERSION.SDK_INT < 23) { request.grant(request.getResources()); return; }
                              java.util.ArrayList<String> needed = new java.util.ArrayList<>();
                              for (String resource : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource) && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) needed.add(Manifest.permission.CAMERA);
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource) && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) needed.add(Manifest.permission.RECORD_AUDIO);
                              }
                              if (needed.isEmpty()) request.grant(request.getResources());
                              else { pendingWebPermission = request; requestPermissions(needed.toArray(new String[0]), WEB_PERMISSION_CODE); }
                          });
                      }
                      @Override public void onPermissionRequestCanceled(PermissionRequest request) {
                          if (pendingWebPermission == request) pendingWebPermission = null;
                      }
                      @Override public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (Build.VERSION.SDK_INT < 23 || (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED)) {
                              callback.invoke(origin, true, false);
                          } else {
                              pendingGeoOrigin = origin; pendingGeoCallback = callback;
                              requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, GEO_PERMISSION_CODE);
                          }
                      }
                  });
                  // Handle website downloads inside Android instead of opening an external browser.
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      try {
                          if (url != null && url.startsWith("blob:")) {
                              String safeName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                              String jsUrl = org.json.JSONObject.quote(url);
                              String jsName = org.json.JSONObject.quote(safeName);
                              String jsMime = org.json.JSONObject.quote(mimeType == null ? "application/octet-stream" : mimeType);
                              String script = "(async function(){try{const r=await fetch(" + jsUrl + ");const b=await r.blob();const reader=new FileReader();reader.onloadend=function(){AndroidBlobDownload.saveBlob(reader.result," + jsName + ",b.type||" + jsMime + ");};reader.readAsDataURL(b);}catch(e){console.error('Blob download failed',e);}})();";
                              webView.evaluateJavascript(script, null);
                              return;
                          }
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                          String cookie = CookieManager.getInstance().getCookie(url);
                          if (cookie != null && !cookie.isEmpty()) request.addRequestHeader("Cookie", cookie);
                          if (userAgent != null && !userAgent.isEmpty()) request.addRequestHeader("User-Agent", userAgent);
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setAllowedOverMetered(true);
                          request.setAllowedOverRoaming(true);
                          request.setTitle(URLUtil.guessFileName(url, contentDisposition, mimeType));
                          request.setDescription("Mengunduh file...");
                          request.setMimeType(mimeType != null ? mimeType : "application/octet-stream");
                          // Simpan ke folder Download publik agar file terlihat di pengelola file.
                          // DownloadManager menangani transfer; jangan meminta izin storage runtime pada Android 10.
                          String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                          DownloadManager manager = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                          if (manager != null) {
                              long downloadId = manager.enqueue(request);
                              android.widget.Toast.makeText(MainActivity.this, "Download dimulai: " + fileName, android.widget.Toast.LENGTH_SHORT).show();
                          } else {
                              android.widget.Toast.makeText(MainActivity.this, "Download tidak tersedia di perangkat ini", android.widget.Toast.LENGTH_LONG).show();
                          }
                      } catch (Exception e) {
                          android.util.Log.e("Web2APK", "Download gagal: " + url, e);
                          String reason = e.getMessage() != null ? e.getMessage() : e.getClass().getSimpleName();
                          android.widget.Toast.makeText(MainActivity.this, "Gagal memulai download: " + reason, android.widget.Toast.LENGTH_LONG).show();
                      }
                  });
                  setContentView(webView);
                  if (savedInstanceState != null) webView.restoreState(savedInstanceState);
                  else webView.loadUrl(startUrl);
              }
              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_CODE && filePathCallback != null) {
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              android.content.ClipData clip = data.getClipData();
                              results = new Uri[clip.getItemCount()];
                              for (int i = 0; i < clip.getItemCount(); i++) results[i] = clip.getItemAt(i).getUri();
                          } else if (data.getData() != null) results = new Uri[]{data.getData()};
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }
              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == WEB_PERMISSION_CODE && pendingWebPermission != null) {
                      boolean allowed = true;
                      for (String resource : pendingWebPermission.getResources()) {
                          if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource) && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) allowed = false;
                          if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource) && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) allowed = false;
                      }
                      if (allowed) pendingWebPermission.grant(pendingWebPermission.getResources()); else pendingWebPermission.deny();
                      pendingWebPermission = null;
                  } else if (requestCode == GEO_PERMISSION_CODE && pendingGeoCallback != null) {
                      boolean allowed = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                      pendingGeoCallback.invoke(pendingGeoOrigin, allowed, false);
                      pendingGeoCallback = null; pendingGeoOrigin = null;
                  }
              }
              private void showOfflinePage() {
                  String page = "<!doctype html><html lang='id'><meta name='viewport' content='width=device-width,initial-scale=1'><meta charset='utf-8'><title>Internet tidak tersedia</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#f3f6ff;display:grid;place-items:center;min-height:90vh;margin:0;padding:24px;text-align:center}main{max-width:360px}h2{font-size:24px}p{color:#c2ccdc;line-height:1.6}button{background:#57d3a5;color:#05281d;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:16px}</style><main><h2>Internet tidak tersedia</h2><p>Periksa koneksi internet kamu, lalu coba lagi. Jika koneksi sudah aktif, halaman mungkin sedang tidak bisa diakses.</p><a href='app://retry' style='display:inline-block;background:#57d3a5;color:#05281d;text-decoration:none;border-radius:10px;padding:12px 20px;font-weight:700'>Coba lagi</a></main></html>";
                  webView.loadDataWithBaseURL(null, page, "text/html", "UTF-8", null);
              }
              @Override protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) webView.saveState(outState);
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          '''.replace("__PACKAGE__", pkg).replace("__URL__", os.environ["WEBSITE_URL"]), encoding="utf-8")
          PY

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "Web2APK"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace = System.getenv("PACKAGE_NAME")
            compileSdk 35
            defaultConfig {
              applicationId System.getenv("PACKAGE_NAME")
              minSdk 21
              targetSdk 29
              versionCode 1
              versionName "1.0"
            }
          }
          dependencies {
          }
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
            <path android:fillColor="#57D3A5" android:pathData="M8,2h32a6,6 0,0 1,6 6v32a6,6 0,0 1,-6 6h-32a6,6 0,0 1,-6 -6v-32a6,6 0,0 1,6 -6z"/>
            <path android:fillColor="#05281D" android:pathData="M14,12h20v5h-7v19h-6v-19h-7z"/>
            <path android:fillColor="#05281D" android:pathData="M13,25l6,6l-3,3l-9,-9l9,-9l3,3z"/>
            <path android:fillColor="#05281D" android:pathData="M35,16l9,9l-9,9l-3,-3l6,-6l-6,-6z"/>
          </vector>
          EOF
          cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/mipmap-anydpi/ic_launcher.xml

          python - <<'PY'
          import os, pathlib, html
          app_name = html.escape(os.environ["APP_NAME"], quote=True)
          (pathlib.Path("app/src/main/res/values/strings.xml")).write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="app_name">'+app_name+'</string></resources>\n',
              encoding="utf-8")
          (pathlib.Path("app/src/main/AndroidManifest.xml")).write_text('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <application android:label="@string/app_name" android:usesCleartextTraffic="false" android:allowBackup="false" android:requestLegacyExternalStorage="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:supportsRtl="true" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name="'''+os.environ["PACKAGE_NAME"]+'''.MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          ''', encoding="utf-8")
          PY

      - name: Apply custom launcher icon (optional)
        env:
          ICON_URL: ${{ inputs.icon_url }}
          ICON_DATA: ${{ inputs.icon_data }}
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64, io, os, pathlib, urllib.request
          from PIL import Image, ImageOps

          raw = b""
          data = os.environ.get("ICON_DATA", "")
          url = os.environ.get("ICON_URL", "")
          if data:
              prefix = "data:image/jpeg;base64,"
              if not data.startswith(prefix):
                  raise SystemExit("Uploaded icon data format is invalid")
              raw = base64.b64decode(data[len(prefix):], validate=True)
          elif url:
              request = urllib.request.Request(url, headers={"User-Agent": "Web2APK-IconBuilder/1.0"})
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.geturl().split(":", 1)[0].lower() != "https":
                      raise SystemExit("Icon URL redirect must remain HTTPS")
                  content_type = response.headers.get("Content-Type", "").split(";", 1)[0].lower()
                  if content_type not in ("image/png", "image/jpeg", "image/jpg", "application/octet-stream"):
                      raise SystemExit("Icon URL must point to a PNG or JPG image")
                  raw = response.read(2 * 1024 * 1024 + 1)
              if len(raw) > 2 * 1024 * 1024:
                  raise SystemExit("Remote icon must be at most 2 MB")
          else:
              print("No custom icon provided; using the default Web2APK icon.")
              raise SystemExit(0)

          try:
              image = Image.open(io.BytesIO(raw))
              if image.format not in ("PNG", "JPEG"):
                  raise ValueError("Only PNG and JPEG images are supported")
              image = ImageOps.exif_transpose(image).convert("RGBA")
              # Fill the entire square canvas (cover/crop), rather than shrinking
              # the whole source into a padded square. This prevents icons from
              # looking tiny when the uploaded image is rectangular.
              # Transparent pixels are composited onto an opaque background.
              fitted = ImageOps.fit(image, (192, 192), method=Image.Resampling.LANCZOS,
                                    centering=(0.5, 0.5))
              canvas = Image.new("RGBA", (192, 192), (255, 255, 255, 255))
              canvas.alpha_composite(fitted)
          except Exception as exc:
              raise SystemExit("Could not decode icon image: " + str(exc))

          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          for density, size in sizes.items():
              folder = pathlib.Path("app/src/main/res") / ("mipmap-" + density)
              folder.mkdir(parents=True, exist_ok=True)
              rendered = canvas.resize((size, size), Image.Resampling.LANCZOS).convert("RGB")
              rendered.save(folder / "ic_launcher.png", format="PNG", optimize=True)
          # Remove the default anydpi vector icon. Android may prefer it over
          # density-specific PNGs, which makes the default letter icon appear
          # even when a custom icon was uploaded.
          default_vector = pathlib.Path("app/src/main/res/mipmap-anydpi/ic_launcher.xml")
          if default_vector.exists():
              default_vector.unlink()
          print("Custom launcher icon cropped to fill the full 1:1 square on all Android densities; default vector removed.")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
