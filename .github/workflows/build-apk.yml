name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "HTTPS URL to load in WebView"
        required: true
        type: string
      app_name:
        description: "Android app display name"
        required: true
        type: string
      package_name:
        description: "Android package ID"
        required: true
        type: string
      icon_url:
        description: "Optional HTTPS URL of PNG/JPG launcher icon"
        required: false
        type: string
      icon_data:
        description: "Optional compressed JPEG data URL (preferred when uploaded)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate inputs
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          ICON_URL: ${{ inputs.icon_url }}
          ICON_DATA: ${{ inputs.icon_data }}
        run: |
          python - <<'PY'
          import os, re
          from urllib.parse import urlparse
          u = urlparse(os.environ["WEBSITE_URL"])
          if u.scheme != "https" or not u.hostname or u.username or u.password:
              raise SystemExit("URL must be HTTPS and contain no credentials")
          name = os.environ["APP_NAME"]
          if not name or len(name) > 40 or any(ord(c) < 32 or c in "<>" for c in name):
              raise SystemExit("Invalid app name")
          if not re.fullmatch(r"[a-z][a-z0-9]*(\.[a-z][a-z0-9]*){1,6}", os.environ["PACKAGE_NAME"]):
              raise SystemExit("Invalid package name")
          if os.environ.get("ICON_URL"):
              icon = urlparse(os.environ["ICON_URL"])
              if icon.scheme != "https" or not icon.hostname or icon.username or icon.password:
                  raise SystemExit("Icon URL must be HTTPS without credentials")
          if len(os.environ.get("ICON_DATA", "")) > 45000:
              raise SystemExit("Icon data is too large")
          PY

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Avoid setup-android action defaulting to the obsolete "tools" package.
      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found on runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create minimal Android project
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi
          python - <<'PY'
          import os, pathlib, re
          pkg = os.environ["PACKAGE_NAME"]
          path = pathlib.Path("app/src/main/java") / pathlib.Path(pkg.replace(".", "/"))
          path.mkdir(parents=True, exist_ok=True)
          (path / "MainActivity.java").write_text(r'''package __PACKAGE__;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.view.ViewGroup;
          import android.view.KeyEvent;

          public class MainActivity extends Activity {
              private WebView webView;
              private String startUrl = "__URL__";
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(-1, -1));
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if ("app".equals(request.getUrl().getScheme()) && "retry".equals(request.getUrl().getHost())) {
                              view.loadUrl(startUrl);
                              return true;
                          }
                          return false;
                      }
                      @Override public void onReceivedError(WebView view, WebResourceRequest request, android.webkit.WebResourceError error) {
                          super.onReceivedError(view, request, error);
                          if (request.isForMainFrame()) showOfflinePage();
                      }
                      @Override public void onReceivedHttpError(WebView view, WebResourceRequest request, android.webkit.WebResourceResponse response) {
                          super.onReceivedHttpError(view, request, response);
                          if (request.isForMainFrame() && response.getStatusCode() >= 500) showOfflinePage();
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  if (savedInstanceState != null) webView.restoreState(savedInstanceState);
                  else webView.loadUrl(startUrl);
              }
              private void showOfflinePage() {
                  String page = "<!doctype html><html lang='id'><meta name='viewport' content='width=device-width,initial-scale=1'><meta charset='utf-8'><title>Internet tidak tersedia</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#f3f6ff;display:grid;place-items:center;min-height:90vh;margin:0;padding:24px;text-align:center}main{max-width:360px}h2{font-size:24px}p{color:#c2ccdc;line-height:1.6}button{background:#57d3a5;color:#05281d;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:16px}</style><main><h2>Internet tidak tersedia</h2><p>Periksa koneksi internet kamu, lalu coba lagi. Jika koneksi sudah aktif, halaman mungkin sedang tidak bisa diakses.</p><a href='app://retry' style='display:inline-block;background:#57d3a5;color:#05281d;text-decoration:none;border-radius:10px;padding:12px 20px;font-weight:700'>Coba lagi</a></main></html>";
                  webView.loadDataWithBaseURL(null, page, "text/html", "UTF-8", null);
              }
              @Override protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) webView.saveState(outState);
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          '''.replace("__PACKAGE__", pkg).replace("__URL__", os.environ["WEBSITE_URL"]), encoding="utf-8")
          PY

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "Web2APK"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace = System.getenv("PACKAGE_NAME")
            compileSdk 35
            defaultConfig {
              applicationId System.getenv("PACKAGE_NAME")
              minSdk 21
              targetSdk 29
              versionCode 1
              versionName "1.0"
            }
          }
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
            <path android:fillColor="#57D3A5" android:pathData="M8,2h32a6,6 0,0 1,6 6v32a6,6 0,0 1,-6 6h-32a6,6 0,0 1,-6 -6v-32a6,6 0,0 1,6 -6z"/>
            <path android:fillColor="#05281D" android:pathData="M14,12h20v5h-7v19h-6v-19h-7z"/>
            <path android:fillColor="#05281D" android:pathData="M13,25l6,6l-3,3l-9,-9l9,-9l3,3z"/>
            <path android:fillColor="#05281D" android:pathData="M35,16l9,9l-9,9l-3,-3l6,-6l-6,-6z"/>
          </vector>
          EOF
          cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/mipmap-anydpi/ic_launcher.xml

          python - <<'PY'
          import os, pathlib, html
          app_name = html.escape(os.environ["APP_NAME"], quote=True)
          (pathlib.Path("app/src/main/res/values/strings.xml")).write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="app_name">'+app_name+'</string></resources>\n',
              encoding="utf-8")
          (pathlib.Path("app/src/main/AndroidManifest.xml")).write_text('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="@string/app_name" android:usesCleartextTraffic="false" android:allowBackup="false" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:supportsRtl="true" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name="'''+os.environ["PACKAGE_NAME"]+'''.MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          ''', encoding="utf-8")
          PY

      - name: Apply custom launcher icon (optional)
        env:
          ICON_URL: ${{ inputs.icon_url }}
          ICON_DATA: ${{ inputs.icon_data }}
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64, io, os, pathlib, urllib.request
          from PIL import Image, ImageOps

          raw = b""
          data = os.environ.get("ICON_DATA", "")
          url = os.environ.get("ICON_URL", "")
          if data:
              prefix = "data:image/jpeg;base64,"
              if not data.startswith(prefix):
                  raise SystemExit("Uploaded icon data format is invalid")
              raw = base64.b64decode(data[len(prefix):], validate=True)
          elif url:
              request = urllib.request.Request(url, headers={"User-Agent": "Web2APK-IconBuilder/1.0"})
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.geturl().split(":", 1)[0].lower() != "https":
                      raise SystemExit("Icon URL redirect must remain HTTPS")
                  content_type = response.headers.get("Content-Type", "").split(";", 1)[0].lower()
                  if content_type not in ("image/png", "image/jpeg", "image/jpg", "application/octet-stream"):
                      raise SystemExit("Icon URL must point to a PNG or JPG image")
                  raw = response.read(2 * 1024 * 1024 + 1)
              if len(raw) > 2 * 1024 * 1024:
                  raise SystemExit("Remote icon must be at most 2 MB")
          else:
              print("No custom icon provided; using the default Web2APK icon.")
              raise SystemExit(0)

          try:
              image = Image.open(io.BytesIO(raw))
              if image.format not in ("PNG", "JPEG"):
                  raise ValueError("Only PNG and JPEG images are supported")
              image = ImageOps.exif_transpose(image).convert("RGBA")
              image.thumbnail((192, 192), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (192, 192), (255, 255, 255, 255))
              canvas.alpha_composite(image, ((192-image.width)//2, (192-image.height)//2))
          except Exception as exc:
              raise SystemExit("Could not decode icon image: " + str(exc))

          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          for density, size in sizes.items():
              folder = pathlib.Path("app/src/main/res") / ("mipmap-" + density)
              folder.mkdir(parents=True, exist_ok=True)
              rendered = canvas.resize((size, size), Image.Resampling.LANCZOS).convert("RGB")
              rendered.save(folder / "ic_launcher.png", format="PNG", optimize=True)
          # Remove the default anydpi vector icon. Android may prefer it over
          # density-specific PNGs, which makes the default letter icon appear
          # even when a custom icon was uploaded.
          default_vector = pathlib.Path("app/src/main/res/mipmap-anydpi/ic_launcher.xml")
          if default_vector.exists():
              default_vector.unlink()
          print("Custom launcher icon applied to all Android densities; default vector removed.")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
